name: build

# The mod is built here and nowhere else. Every push gets a versioned, installable package as a
# run artifact, so "what did the tester actually run" always has an answer.
#
#   feature branch / PR   0.1.2-dev.<short-sha>   artifact only
#   main                  0.1.2-rc.N              artifact + a v0.1.2-rc.N tag on the commit
#   release               0.1.2                   cut by hand from an rc, see release.yml
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # NOT on main. Every build of main is a release candidate and gets a tag, and release.yml can
  # only promote a tag that exists. Cancelling the in-flight build of an earlier commit skips its
  # tag-rc job -- but ci_version.sh numbers rc's by counting commits, so the number is not handed
  # back. Two pushes in quick succession would leave a permanent hole in the rc sequence and an
  # rc that can never be released.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      tag: ${{ steps.v.outputs.tag }}
      artifact: ${{ steps.v.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          # rc numbering counts commits since the VERSION bump; a shallow clone cannot.
          fetch-depth: 0

      - id: v
        env:
          # On a pull_request the checkout is the merge commit and GITHUB_REF_NAME is "N/merge".
          # Version the branch that is being proposed, not the ephemeral merge.
          VERSION_REF_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          VERSION_REF_TYPE: ${{ github.ref_type }}
          VERSION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci_version.sh | tee -a "$GITHUB_OUTPUT"

      - run: echo "### ${{ steps.v.outputs.version }} (${{ steps.v.outputs.channel }})" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    runs-on: windows-latest
    # A hung MSBuild otherwise burns the 6-hour default, and Windows minutes bill at 2x.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # BUILD THE COMMIT THE VERSION NAMES. The version job stamps the package with the head
          # of the branch being proposed (see VERSION_SHA above); checking out the default ref
          # here would build the ephemeral merge commit instead, so a -dev package would carry one
          # sha in its filename and a different one in the INSTALL.txt line build_dist.ps1 writes
          # from `git rev-parse HEAD`. "What did the tester actually run" needs those to agree.
          #
          # The trade: a PR build no longer proves the MERGE compiles, only the branch. That is
          # covered anyway -- push builds every branch including main, so a merge that breaks the
          # build is caught by main's own run seconds later.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # OpenXR-SDK and imgui come down through FetchContent on every configure otherwise.
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-

      # Which MSVC produced a DLL is the first question a crash report raises, and the runner
      # image changes under us -- windows-latest carried VS2022 until it didn't.
      - name: Toolchain
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * -property displayName
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * -property catalog_productDisplayVersion

      # CyberpunkVR_Stereo.dll -- the VR plugin itself.
      #
      # The generator is NOT pinned. Naming one ties the build to a Visual Studio version that the
      # runner image drops without warning; CMake's own default is the newest VS actually
      # installed, which is the thing we want and cannot go stale.
      - name: Configure stereo plugin
        run: cmake -S . -B build -A x64
      - name: Build stereo plugin
        run: cmake --build build --config Release --parallel

      # CyberpunkVR_Hands.dll -- a separate RED4ext plugin with its own project. build_dist.ps1
      # looks for it under src\red4ext_plugin\build\RelWithDebInfo\, so build it exactly there.
      - name: Configure hands plugin
        run: cmake -S src/red4ext_plugin -B src/red4ext_plugin/build -A x64
      - name: Build hands plugin
        run: cmake --build src/red4ext_plugin/build --config RelWithDebInfo --parallel

      - name: Package
        run: pwsh scripts/build_dist.ps1 -Version "${{ needs.version.outputs.version }}" -Zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.artifact }}
          path: dist/CyberpunkVRPort-${{ needs.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 90

      # Not shipped, never in the package -- but a crash dump from this build is unreadable
      # without it, and the build tree is gone the moment the runner is recycled.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.artifact }}-symbols
          path: |
            build/bin/red4ext/plugins/CyberpunkVR_Stereo/Release/*.pdb
            src/red4ext_plugin/build/RelWithDebInfo/*.pdb
          if-no-files-found: warn
          retention-days: 90

  # Every build of main is a release candidate and gets a tag, so release.yml has something
  # concrete to promote and an rc is always traceable to one commit.
  tag-rc:
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag ${{ needs.version.outputs.tag }}
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, leaving it alone"
            exit 0
          fi
          git -c user.name=github-actions[bot] \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG" -m "Release candidate $TAG"
          git push origin "refs/tags/$TAG"
