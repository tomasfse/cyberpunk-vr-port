name: build

# The mod is built here and nowhere else. Every push gets a versioned, installable package as a
# run artifact, so "what did the tester actually run" always has an answer.
#
#   feature branch / PR   0.1.2-dev.<short-sha>     artifact only
#   main                  0.1.2-rc.N.<short-sha>    tagged + published as a GitHub prerelease
#   release               0.1.2                     cut by hand from an rc, see release.yml
#
# ONE RUN PER COMMIT, from whichever event can see it.
#
# Both triggers are on, because neither covers everything. `push` does not fire for a PR opened
# from a FORK -- the push happened in the fork, not here -- and this project takes fork PRs (#5
# and #6 in the history came from other accounts). `pull_request` does not fire for a branch with
# no PR open, and a tester's -dev package is often wanted before there is one.
#
# Left alone the two overlap on same-repo branches: a branch with an open PR built twice for the
# same commit. Not two views of the change -- the build job checks out the PR's HEAD rather than
# the merge commit, so both runs compiled the same sha into the same package under the same
# version, billed twice at the Windows rate.
#
# So the `pull_request` run is dropped for PRs whose head is in THIS repo, which is exactly the
# overlapping case. Same-repo branch -> one run via push. Fork PR -> one run via pull_request.
# The `if` sits on the version job alone: build needs it, publish-rc needs both, and a skipped
# dependency skips them too.
#
# No `tags-ignore` is needed: a branch filter already excludes tag pushes, which matters because
# publish-rc pushes a tag from inside this workflow.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # NOT on main. Every build of main is a release candidate and gets a tag, and release.yml can
  # only promote a tag that exists. Cancelling the in-flight build of an earlier commit skips its
  # publish-rc job -- but ci_version.sh numbers rc's by counting commits, so the number is not
  # handed back. Two pushes in quick succession would leave a permanent hole in the rc sequence
  # and an rc that can never be released.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  version:
    # Skip the pull_request run when push already built this commit -- see the header.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      tag: ${{ steps.v.outputs.tag }}
      artifact: ${{ steps.v.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          # rc numbering counts commits since the VERSION bump; a shallow clone cannot.
          fetch-depth: 0

      - id: v
        env:
          # On a pull_request the checkout is the merge commit and GITHUB_REF_NAME is "N/merge".
          # Version the branch that is being proposed, not the ephemeral merge.
          VERSION_REF_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          VERSION_REF_TYPE: ${{ github.ref_type }}
          VERSION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci_version.sh | tee -a "$GITHUB_OUTPUT"

      - run: echo "### ${{ steps.v.outputs.version }} (${{ steps.v.outputs.channel }})" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    runs-on: windows-latest
    # A hung MSBuild otherwise burns the 6-hour default, and Windows minutes bill at 2x.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # BUILD THE COMMIT THE VERSION NAMES. The version job stamps the package with the head
          # of the branch being proposed (see VERSION_SHA above); checking out the default ref
          # here would build the ephemeral merge commit instead, so a -dev package would carry one
          # sha in its filename and a different one in the INSTALL.txt line build_dist.ps1 writes
          # from `git rev-parse HEAD`. "What did the tester actually run" needs those to agree.
          #
          # The trade: a PR build no longer proves the MERGE compiles, only the branch. Pushes to
          # main are still built, so a merge that breaks the build is caught by main's own run
          # seconds later -- and on main that run is the rc, which is the one that has to be good.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # OpenXR-SDK and imgui come down through FetchContent on every configure otherwise.
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-

      # Which MSVC produced a DLL is the first question a crash report raises, and the runner
      # image changes under us -- windows-latest carried VS2022 until it didn't.
      - name: Toolchain
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * -property displayName
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * -property catalog_productDisplayVersion

      # CyberpunkVR_Stereo.dll -- the VR plugin itself.
      #
      # The generator is NOT pinned. Naming one ties the build to a Visual Studio version that the
      # runner image drops without warning; CMake's own default is the newest VS actually
      # installed, which is the thing we want and cannot go stale.
      - name: Configure stereo plugin
        run: cmake -S . -B build -A x64
      - name: Build stereo plugin
        run: cmake --build build --config Release --parallel

      # No -Zip. actions/upload-artifact ALWAYS zips what it is handed, so uploading our own
      # zip produced a zip inside a zip: Vortex opened the outer one, found a single .zip with
      # no fomod\ and no game folders at its root, and had nothing to install.
      - name: Package
        run: pwsh scripts/build_dist.ps1 -Version "${{ needs.version.outputs.version }}"

      # Upload the package TREE. GitHub's own wrapper then IS the package, so what a tester
      # downloads installs directly in Vortex and still extracts correctly by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.artifact }}
          path: dist/CyberpunkVRPort-${{ needs.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 90

      # Not shipped, never in the package -- but a crash dump from this build is unreadable
      # without it, and the build tree is gone the moment the runner is recycled.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.artifact }}-symbols
          path: build/bin/red4ext/plugins/CyberpunkVR_Stereo/Release/*.pdb
          if-no-files-found: warn
          retention-days: 90

  # Every build of main is a release candidate: it gets a tag, so release.yml has something
  # concrete to promote and an rc is always traceable to one commit, and it gets a GitHub
  # prerelease carrying the package.
  #
  # The prerelease is what makes an rc reachable. A run artifact needs a signed-in GitHub account
  # to download and is deleted after 90 days; a release asset is a plain public URL that does not
  # expire, which is what a tester actually needs. GitHub keeps prereleases off the "Latest"
  # badge, so a real release still stands out.
  publish-rc:
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # push the tag, create the prerelease
      actions: read     # download this run's own package artifact
    steps:
      - uses: actions/checkout@v4

      - name: Tag ${{ needs.version.outputs.tag }}
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Not `exit 0` on the already-exists path any more: the prerelease step below still has
          # to run, or a re-run that finds its tag in place would leave the release unpublished.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, leaving it alone"
          else
            git -c user.name=github-actions[bot] \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                tag -a "$TAG" -m "Release candidate $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish ${{ needs.version.outputs.tag }} as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          ARTIFACT: ${{ needs.version.outputs.artifact }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "prerelease $TAG is already published, leaving it alone"
            exit 0
          fi
          # This run's own artifact -- no searching for it, the build job that produced it is a
          # declared dependency. It comes back extracted, as the package tree.
          gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT" --dir pkg
          (cd pkg && zip -qr "../CyberpunkVRPort-$VERSION.zip" .)
          gh release create "$TAG" \
            --prerelease \
            --title "CyberpunkVRPort $VERSION" \
            --generate-notes \
            --notes "Release candidate, built from \`$GITHUB_SHA\`. Not a release: the **release** workflow promotes it once it has been tested, publishing these exact binaries rather than rebuilding them." \
            "CyberpunkVRPort-$VERSION.zip"
