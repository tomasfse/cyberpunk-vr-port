name: release

# The author writes the release. This only attaches the binary.
#
#   GitHub -> Releases -> Draft a new release -> tag 0.1.3, write the notes, Publish
#   => this workflow finds the release candidate built from that same commit, restamps the
#      version the package names, and attaches CyberpunkVRPort-0.1.3.zip
#
# IT DOES NOT REBUILD. The zip a player downloads is the one the rc's build produced, so what
# ships is what a tester ran. Recompiling "the same commit" would quietly hand out binaries
# nobody has tested, and preserving that matters more than any convenience here.
#
# WHY IT MATCHES BY COMMIT and not "the newest rc": the release tag already names a commit, so
# there is nothing to type and nothing to get wrong. The newest rc is not necessarily the one
# that was tested, and it is the wrong answer outright when a release is cut from an earlier
# commit. Every commit on main gets an rc, so whichever commit the author picks has one waiting.
#
# Drafts do not trigger workflows -- GitHub fires `release` only on publish -- so there is a
# minute or two between the release going public and its asset appearing. That is the cost of
# letting the author work entirely in the Releases UI, and it is worth it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    # Prereleases are the rc's themselves, published by build.yml. Attaching to those would be a
    # loop: an rc already carries its own package.
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the release candidate for this commit
        id: rc
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be a bare X.Y.Z, got '$TAG'"
            exit 1
          fi

          sha=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")

          # The rc tag on the SAME commit. --points-at is exact: no sorting, no guessing which
          # candidate was meant. More than one can only happen if main was force-pushed and a
          # commit collected two rc numbers; take the newest and say so rather than pick silently.
          mapfile -t rcs < <(git tag --points-at "$sha" --sort=-creatordate | grep -E -- '-rc\.' || true)
          if [[ ${#rcs[@]} -eq 0 ]]; then
            echo "::error::no release candidate was built from $sha -- only commits on main get one, and the package has to come from a build that already happened"
            exit 1
          fi
          if [[ ${#rcs[@]} -gt 1 ]]; then
            echo "::warning::$sha carries ${#rcs[@]} rc tags (${rcs[*]}); using the newest"
          fi
          rc=${rcs[0]}

          echo "releasing $version from $rc ($sha)"
          {
            echo "version=$version"
            echo "rc=$rc"
          } >> "$GITHUB_OUTPUT"

      - name: Restamp ${{ steps.rc.outputs.rc }} as ${{ steps.rc.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.rc.outputs.rc }}
          VERSION: ${{ steps.rc.outputs.version }}
        run: |
          set -euo pipefail
          # From the rc's own prerelease asset, not from the build run's artifact: a run artifact
          # is deleted after 90 days, a release asset is not. Promoting a candidate older than
          # that used to fail with nothing left to download.
          gh release download "$RC" --pattern '*.zip' --dir staging
          zip=$(ls staging/*.zip)
          unzip -q "$zip" -d pkg

          if [[ ! -f pkg/INSTALL.txt || ! -f pkg/fomod/info.xml ]]; then
            echo "::error::$RC's asset is not a package -- no INSTALL.txt or fomod/info.xml at its root"
            ls -la pkg
            exit 1
          fi

          # The two files in the package that name a version. Nothing the game loads is touched,
          # which is the whole point of promoting rather than rebuilding.
          #
          # Not anchored to end-of-line: build_dist.ps1 writes INSTALL.txt from Windows, so every
          # line ends CRLF and `...$VERSION$` would never match -- silently shipping a release
          # that still calls itself an rc.
          sed -i "1s|CyberpunkVRPort $RC|CyberpunkVRPort $VERSION|" pkg/INSTALL.txt
          if ! head -1 pkg/INSTALL.txt | grep -qF "CyberpunkVRPort $VERSION"; then
            echo "::error::INSTALL.txt still reads '$(head -1 pkg/INSTALL.txt)' -- refusing to publish a mislabelled package"
            exit 1
          fi
          head -1 pkg/INSTALL.txt

          # This one is what a Vortex user sees on the mod's row.
          sed -i "s|<Version>$RC</Version>|<Version>$VERSION</Version>|" pkg/fomod/info.xml
          if ! grep -qF "<Version>$VERSION</Version>" pkg/fomod/info.xml; then
            echo "::error::fomod/info.xml still reads '$(grep -o '<Version>[^<]*</Version>' pkg/fomod/info.xml)' -- refusing to publish a mislabelled package"
            exit 1
          fi
          grep -o '<Version>[^<]*</Version>' pkg/fomod/info.xml

          (cd pkg && zip -qr "../CyberpunkVRPort-$VERSION.zip" .)

      - name: Attach it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.rc.outputs.version }}
        run: |
          set -euo pipefail
          # --clobber so re-running over a partial attempt replaces the asset instead of failing.
          gh release upload "$TAG" "CyberpunkVRPort-$VERSION.zip" --clobber
