name: release

# Releases are cut by hand, always from a release candidate that already exists.
#
# It does not rebuild. It takes the exact package the build job produced for that rc, so the DLLs
# a player downloads are byte-for-byte the ones a tester ran -- only the version stamped on the
# package changes. Recompiling "the same commit" would quietly hand out binaries nobody tested.
#
#   Actions -> release -> Run workflow -> rc_tag: 0.1.2-rc.3.a1b2c3d
#   => tag 0.1.2 on that commit + a GitHub release carrying CyberpunkVRPort-0.1.2.zip
#
# Tags are bare, with no `v` prefix, matching the tags the author already published.
on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'Release candidate to promote, e.g. 0.1.2-rc.3.a1b2c3d. Blank = the newest rc.'
        required: false
        type: string
      version:
        description: 'Release version. Defaults to the rc with -rc.N dropped.'
        required: false
        type: string
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the candidate
        id: rc
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Blank means the newest rc, which is what you want in all but the rare case of
          # promoting an older candidate. Sorted by creation date rather than by version: rc tags
          # are annotated and created in order, and version sort has opinions about where a
          # prerelease suffix ranks that are not worth depending on here.
          if [[ -z ${RC_TAG:-} ]]; then
            RC_TAG=$(git tag --list --sort=-creatordate | grep -E -- '-rc\.' | head -1)
            if [[ -z $RC_TAG ]]; then
              echo "::error::no rc tag exists yet -- push to main to build one"
              exit 1
            fi
            echo "no rc_tag given, promoting the newest: $RC_TAG"
          fi
          # Tags are bare. A typed-in `v` is stripped rather than rejected -- it resolves to the
          # same release either way, and being strict about it would only fail a human's habit.
          RC_TAG=${RC_TAG#v}
          # rc tags carry the commit: 0.1.2-rc.3.a1b2c3d. The sha is part of the tag name, not
          # decoration, so it is required here -- a bare 0.1.2-rc.3 names no tag that exists.
          if [[ ! $RC_TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+\.[0-9A-Za-z]+$ ]]; then
            echo "::error::rc_tag must look like 0.1.2-rc.3.a1b2c3d, got '$RC_TAG'"
            exit 1
          fi
          if ! sha=$(git rev-parse -q --verify "refs/tags/$RC_TAG^{commit}"); then
            echo "::error::tag $RC_TAG does not exist -- only builds of main are tagged as rc"
            exit 1
          fi

          rc_version=$RC_TAG
          if [[ -n $OVERRIDE ]]; then
            version=${OVERRIDE#v}
            if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be a bare X.Y.Z, got '$OVERRIDE'"
              exit 1
            fi
          else
            version=${rc_version%-rc.*}
          fi

          # Bare, so this also sees the releases the author tagged by hand before CI existed.
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "::error::$version is already tagged -- bump VERSION on main before releasing again"
            exit 1
          fi

          {
            echo "sha=$sha"
            echo "rc_tag=$RC_TAG"
            echo "rc_version=$rc_version"
            echo "version=$version"
            echo "rc_artifact=CyberpunkVRPort-$rc_version"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the package that rc built
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.rc.outputs.sha }}
          ARTIFACT: ${{ steps.rc.outputs.rc_artifact }}
        run: |
          set -euo pipefail
          # `// empty` is load-bearing. Over an empty result jq evaluates .[0] to null, field
          # access on null is null again, and -r prints the four characters "null" -- a non-empty
          # string that sails straight past the guard below and reaches `gh run download null`.
          # The clear error this step exists to produce would never have been printed.
          run_id=$(gh run list --workflow build.yml --commit "$SHA" --status success \
                     --limit 20 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z ${run_id:-} ]]; then
            echo "::error::no successful build run for $SHA -- the rc never produced a package"
            exit 1
          fi
          echo "promoting artifact from build run $run_id"
          gh run download "$run_id" --name "$ARTIFACT" --dir staging

      - name: Restamp the package as ${{ steps.rc.outputs.version }}
        env:
          RC_VERSION: ${{ steps.rc.outputs.rc_version }}
          VERSION: ${{ steps.rc.outputs.version }}
        run: |
          set -euo pipefail
          # gh run download EXTRACTS the artifact, and the artifact is now the package tree
          # itself, so there is nothing to unzip. An rc built before that change still carries
          # the old zip-inside-a-zip; handle both so an older candidate stays promotable.
          if [[ -f "staging/CyberpunkVRPort-$RC_VERSION.zip" ]]; then
            unzip -q "staging/CyberpunkVRPort-$RC_VERSION.zip" -d pkg
          else
            mv staging pkg
          fi
          if [[ ! -f pkg/INSTALL.txt || ! -f pkg/fomod/info.xml ]]; then
            echo "::error::this artifact is not a package -- no INSTALL.txt or fomod/info.xml at its root"
            ls -la pkg
            exit 1
          fi
          # The only thing in the package that names a version. Nothing that is loaded by the
          # game is touched, which is the whole point of promoting rather than rebuilding.
          #
          # Not anchored to end-of-line: build_dist.ps1 writes this file from Windows, so every
          # line ends CRLF and `...$VERSION$` would never match -- silently shipping a release
          # that still calls itself an rc.
          sed -i "1s|CyberpunkVRPort $RC_VERSION|CyberpunkVRPort $VERSION|" pkg/INSTALL.txt
          if ! head -1 pkg/INSTALL.txt | grep -qF "CyberpunkVRPort $VERSION"; then
            echo "::error::INSTALL.txt still reads '$(head -1 pkg/INSTALL.txt)' -- refusing to publish a mislabelled package"
            exit 1
          fi
          head -1 pkg/INSTALL.txt

          # The FOMOD carries the version too, and it is the one a Vortex user actually sees on
          # the mod's row. Miss it and a promoted release introduces itself as the rc it came from.
          sed -i "s|<Version>$RC_VERSION</Version>|<Version>$VERSION</Version>|" pkg/fomod/info.xml
          if ! grep -qF "<Version>$VERSION</Version>" pkg/fomod/info.xml; then
            echo "::error::fomod/info.xml still reads '$(grep -o '<Version>[^<]*</Version>' pkg/fomod/info.xml)' -- refusing to publish a mislabelled package"
            exit 1
          fi
          grep -o '<Version>[^<]*</Version>' pkg/fomod/info.xml
          (cd pkg && zip -qr "../CyberpunkVRPort-$VERSION.zip" .)

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.rc.outputs.sha }}
          RC_TAG: ${{ steps.rc.outputs.rc_tag }}
          VERSION: ${{ steps.rc.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # The previous RELEASE, computed BEFORE this one is tagged. --generate-notes on its own
          # measures from the previous TAG, and every build of main leaves an rc -- so the notes
          # for 0.1.2 would cover the handful of commits since 0.1.2-rc.11 rather than the whole
          # cycle since 0.1.1. Bare tags make the filter trivial: a release has no -rc. in it.
          prev=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$VERSION" -m "CyberpunkVRPort $VERSION (promoted from $RC_TAG)" "$SHA"
          git push origin "refs/tags/$VERSION"

          args=(--title "CyberpunkVRPort $VERSION" --generate-notes
                --notes "Promoted from \`$RC_TAG\` — the binaries in this package are the ones that rc built, unchanged.")
          # Absent on the very first release, and gh then falls back to the previous tag on its own.
          if [[ -n $prev ]]; then
            echo "release notes measured from $prev"
            args+=(--notes-start-tag "$prev")
          fi
          if [[ $DRAFT == true ]]; then args+=(--draft); fi
          if [[ $PRERELEASE == true ]]; then args+=(--prerelease); fi
          gh release create "$VERSION" "${args[@]}" "CyberpunkVRPort-$VERSION.zip"
